[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opcua-collector"
version = "0.1.0"
description = "Event-driven OPC UA collector that stores one PostgreSQL row per machine cycle."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "João Pedro" }]
keywords = [
    "opcua",
    "opc-ua",
    "industrial-automation",
    "postgresql",
    "historian",
    "iiot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "asyncua>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
opcua-collector = "opcua_collector.cli:main"
opcua-simulator = "opcua_collector.simulator.server:main"

[project.urls]
Homepage = "https://github.com/Urbano1897/ColetorOPCua"
Repository = "https://github.com/Urbano1897/ColetorOPCua"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
